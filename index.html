<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VITEG Gudang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- LOGIN -->
  <div id="login" class="login hidden">
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="brand-mark">VG</div>
      <h1 id="loginTitle">VITEG Gudang</h1>
      <p class="muted" id="loginOrg"></p>
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary block" type="submit">Masuk</button>
      <p class="form-error" id="loginError"></p>
    </form>
  </div>

  <!-- APLIKASI -->
  <div id="app" class="hidden">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="brand-mark sm">VG</div>
        <div>
          <strong id="appName">VITEG Gudang</strong>
          <small id="appOrg"></small>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="side-user">
        <div>
          <strong id="userName"></strong>
          <small id="userRole"></small>
        </div>
        <button class="btn ghost sm" id="btnLogout" title="Keluar">Keluar</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="btnMenu" aria-label="Menu">&#9776;</button>
        <h2 id="pageTitle"></h2>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
